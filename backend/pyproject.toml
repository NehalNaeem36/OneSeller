[project]
name = "oneseller-backend"
version = "0.1.0"
description = "OneSeller AI — FastAPI backend and LangGraph sales agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9",
  "openpyxl>=3.1",
  "email-validator>=2.1",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langchain-anthropic>=0.3",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
